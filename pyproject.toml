[project]
name = "charlotte"
version = "0.1.0"
description = "Charlotte Mason homeschool agent for logging, planning, and material creation"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.58",
    "requests>=2.32",
    "openpyxl>=3.1",
    "google-genai>=0.3",
    "faster-whisper>=1.0",
    "PyYAML>=6.0",
    "weasyprint>=62",
    "qrcode[pil]>=7.4",
    "signal-sieve @ git+https://github.com/bbusenius/signal-sieve.git@master",
    "xlsx-append @ git+https://github.com/bbusenius/xlsx-append.git@master",
    "homeschool_dashboard @ git+https://github.com/bbusenius/Homeschool-Dashboard.git@master",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
